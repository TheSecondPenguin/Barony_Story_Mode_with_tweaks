name: Bootstrap and verify Barony
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore authorized source history without replacing remote history
        run: |
          git config user.name 'Barony Development Automation'
          git config user.email 'barony-automation@users.noreply.github.com'
          git bundle verify barony-public-upstream.bundle
          git fetch ./barony-public-upstream.bundle refs/heads/bootstrap/public-upstream:refs/remotes/bootstrap/baseline
          git merge --no-commit --no-ff --allow-unrelated-histories refs/remotes/bootstrap/baseline
      - name: Install public compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev libpng-dev zlib1g-dev libphysfs-dev rapidjson-dev libgl1-mesa-dev
          cmake --version
          c++ --version
          dpkg-query -W cmake libsdl2-dev libsdl2-image-dev libsdl2-net-dev libsdl2-ttf-dev libpng-dev zlib1g-dev libphysfs-dev rapidjson-dev libgl1-mesa-dev
      - name: Compile pinned unchanged baseline
        run: |
          set -o pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFMOD_ENABLED=OFF -DOPENAL_ENABLED=OFF -DSTEAMWORKS_ENABLED=0 -DEOS_ENABLED=0 -DPLAYFAB_ENABLED=0 2>&1 | tee baseline-build.log
          cmake --build build --parallel 2 2>&1 | tee -a baseline-build.log
      - name: Preserve verified source with additive merge commit
        run: |
          if test -f "$(git rev-parse --git-path MERGE_HEAD)"; then
            git commit -m 'Import preserved Barony project history after vanilla compiler verification'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-compiler-log
          path: baseline-build.log
          if-no-files-found: ignore
